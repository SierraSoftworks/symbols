name: Changelog

# Keeps a draft release up to date from merged PRs (and auto-labels open PRs
# from their branch names) via .github/release-drafter.yml. Mirrors grey's
# setup, with the token permissions release-drafter needs made explicit.
on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
