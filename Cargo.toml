[workspace]
resolver = "2"
members = ["server", "ui"]
default-members = ["server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SierraSoftworks/symbols"

# Profiles only take effect at the workspace root.
[profile.release]
opt-level = "s"
lto = true
# Line tables for symbolication; stripped at link time for local builds. CI
# overrides strip via CARGO_PROFILE_RELEASE_STRIP=none and splits the debug
# info out with the publish-symbols action instead.
debug = 1
strip = "debuginfo"
