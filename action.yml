name: Publish Debug Symbols
description: >-
  Extracts debug symbols from a built binary (ELF .debug via objcopy on Linux,
  dSYM via dsymutil on macOS, the MSVC PDB on Windows) and publishes them to a
  SierraSoftworks symbols server, authenticated with the workflow's GitHub
  OIDC id-token. Requires `permissions: id-token: write`. On Linux and macOS
  the binary is stripped in-place afterwards, so release assets and container
  images keep their usual size. Symbol trouble never blocks a release: by
  default a failed extraction or upload is reported as a warning and the job
  carries on (set fail-on-error to make it fail instead).
branding:
  icon: layers
  color: purple

inputs:
  binary:
    description: Path to the built binary to extract symbols from.
    required: true
  version:
    description: Release/version tag these symbols belong to (groups them for retention).
    required: false
    default: ${{ github.ref_name }}
  server:
    description: Base URL of the symbols server.
    required: false
    default: https://symbols.sierrasoftworks.com
  audience:
    description: OIDC audience expected by the symbols server.
    required: false
    default: symbols.sierrasoftworks.com
  publish:
    description: >-
      Whether to publish the extracted symbols to the server. Set to "false"
      in build jobs that only extract (and strip): the symbol file then
      travels alongside the binary in a build artifact, and a later job runs
      this action again (publish left at "true") to upload it — the action
      detects the pre-extracted file and skips re-extraction. Extraction must
      happen in the job that ran the build: on macOS the DWARF lives in the
      build tree's object files (dsymutil reads them), and on Windows the PDB
      is a sibling file the linker wrote — neither survives into a fresh
      runner that only downloads the binary.
    required: false
    default: "true"
  attach-to-release:
    description: Also attach the symbol file as an asset on the current GitHub release.
    required: false
    default: "false"
  token:
    description: GitHub token used only when attach-to-release is enabled.
    required: false
    default: ${{ github.token }}
  fail-on-error:
    description: >-
      Fail the job when extraction or publishing fails. Off by default:
      symbols are a debugging aid, and losing one build's symbols is not
      worth blocking its release — failures surface as workflow warnings
      instead.
    required: false
    default: "false"

outputs:
  build-id:
    description: The build identifier derived by the server.
    value: ${{ steps.publish.outputs.build-id }}
  symbol-file:
    description: Path of the extracted symbol file.
    value: ${{ steps.extract.outputs.symbol-file }}

runs:
  using: composite
  steps:
    - name: Extract debug symbols
      id: extract
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        BINARY="${{ inputs.binary }}"
        if [ ! -f "$BINARY" ]; then
          echo "::error::binary '$BINARY' does not exist" >&2
          exit 1
        fi

        case "$RUNNER_OS" in
          Linux)
            SYMFILE="${BINARY}.debug"
            if [ -f "$SYMFILE" ]; then
              # Pre-extracted by an earlier extract-only run (publish: false)
              # and carried here in a build artifact; the binary alongside it
              # is already stripped, so re-splitting would destroy the DWARF.
              echo "reusing pre-extracted $SYMFILE"
            else
              # Keep the DWARF (compressed) and the symbol table in the split
              # file, link the shipped binary to it, then strip the shipped
              # binary back down to the size it would have had under cargo's
              # own strip="debuginfo". Requires the build to have run with
              # CARGO_PROFILE_RELEASE_STRIP=none (or strip = "none").
              objcopy --only-keep-debug --compress-debug-sections=zlib "$BINARY" "$SYMFILE"
              objcopy --add-gnu-debuglink="$SYMFILE" "$BINARY"
              objcopy --strip-debug "$BINARY"
            fi
            ;;
          macOS)
            SYMFILE="${BINARY}.dSYM/Contents/Resources/DWARF/$(basename "$BINARY")"
            if [ -f "$SYMFILE" ]; then
              echo "reusing pre-extracted $SYMFILE"
            else
              # dsymutil collects DWARF from the build tree's object files, so
              # this branch only produces real debug info in the job that ran
              # the build — extract there (publish: false) when publishing
              # happens in a separate job.
              dsymutil "$BINARY" -o "${BINARY}.dSYM"
              strip -S "$BINARY"
            fi
            ;;
          Windows)
            SYMFILE="${BINARY%.exe}.pdb"
            if [ ! -f "$SYMFILE" ]; then
              # rustc names the MSVC PDB after the crate with hyphens
              # replaced by underscores (git-tool.exe -> git_tool.pdb).
              STEM="$(basename "${BINARY%.exe}" | tr '-' '_')"
              SYMFILE="$(dirname "$BINARY")/$STEM.pdb"
            fi
            if [ ! -f "$SYMFILE" ]; then
              echo "::error::expected a PDB next to the binary ('${BINARY%.exe}.pdb' or '$SYMFILE') - is debug info enabled, and did the build artifact include the PDB?" >&2
              exit 1
            fi
            ;;
          *)
            echo "::error::unsupported runner OS '$RUNNER_OS'" >&2
            exit 1
            ;;
        esac

        ls -la "$SYMFILE"
        echo "symbol-file=$SYMFILE" >> "$GITHUB_OUTPUT"

    - name: Publish to the symbols server
      id: publish
      if: inputs.publish == 'true' && steps.extract.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::no OIDC token available - add 'permissions: id-token: write' to the workflow" >&2
          exit 1
        fi

        # Fetched fresh before every request: GitHub id-tokens expire after a
        # few minutes, and a chunked upload of a large symbol file can
        # outlive the token that started it.
        fresh_token() {
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ inputs.audience }}" | jq -r .value
        }

        uri() { jq -rn --arg v "$1" '$v|@uri'; }

        # Target/build metadata, shown alongside the symbols in the server's
        # management UI. The server derives format and (where the file carries
        # one) architecture from the file itself; these tags fill in the rest
        # and link the upload back to this workflow run.
        case "$RUNNER_OS" in
          Linux) OS=linux ;;
          macOS) OS=macos ;;
          Windows) OS=windows ;;
          *) OS="" ;;
        esac
        case "${RUNNER_ARCH:-}" in
          X64) ARCH=amd64 ;;
          ARM64) ARCH=arm64 ;;
          X86) ARCH=i386 ;;
          ARM) ARCH=arm ;;
          *) ARCH="" ;;
        esac
        BUILD_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

        QUERY="version=$(uri "${{ inputs.version }}")"
        QUERY="$QUERY&os=$OS&arch=$ARCH&commit=$GITHUB_SHA"
        QUERY="$QUERY&build_url=$(uri "$BUILD_URL")"

        # Symbols go up gzipped. DWARF compresses several-fold, which keeps
        # most uploads inside the request body limits of any CDN in front of
        # the server, and the server stores what it receives — so this costs
        # neither side a re-encode.
        SYMFILE="${{ steps.extract.outputs.symbol-file }}"
        gzip -c "$SYMFILE" > "$SYMFILE.gz"
        ls -la "$SYMFILE.gz"

        # Files that stay under the CDN's request cap even gzipped go up in
        # one request; anything larger goes through the server's chunked
        # upload protocol in CDN-sized parts.
        SIZE="$(wc -c < "$SYMFILE.gz" | tr -d ' ')"
        SINGLE_LIMIT=$((90 * 1024 * 1024))
        CHUNK_SIZE=$((64 * 1024 * 1024))

        if [ "$SIZE" -le "$SINGLE_LIMIT" ]; then
          RESPONSE="$(curl -sSf -X POST \
            "${{ inputs.server }}/api/v1/symbols?$QUERY" \
            -H "Authorization: Bearer $(fresh_token)" \
            -H "Content-Type: application/octet-stream" \
            -H "Content-Encoding: gzip" \
            --data-binary "@$SYMFILE.gz")"
        else
          echo "symbol file is $SIZE bytes gzipped; using a chunked upload"
          UPLOAD_ID="$(curl -sSf -X POST \
            "${{ inputs.server }}/api/v1/uploads?$QUERY" \
            -H "Authorization: Bearer $(fresh_token)" | jq -r .upload_id)"

          CHUNK_DIR="$RUNNER_TEMP/symbol-chunks"
          rm -rf "$CHUNK_DIR" && mkdir -p "$CHUNK_DIR"
          # Alphabetic suffixes (the default) sort lexically, so the glob
          # below walks the parts in order on every platform's split.
          split -b "$CHUNK_SIZE" "$SYMFILE.gz" "$CHUNK_DIR/chunk-"

          INDEX=0
          for CHUNK in "$CHUNK_DIR"/chunk-*; do
            # Chunk PUTs are idempotent, so transient failures retry safely.
            curl -sSf -X PUT --retry 2 \
              "${{ inputs.server }}/api/v1/uploads/$UPLOAD_ID/chunks/$INDEX" \
              -H "Authorization: Bearer $(fresh_token)" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$CHUNK" > /dev/null
            echo "uploaded chunk $INDEX ($(wc -c < "$CHUNK" | tr -d ' ') bytes)"
            INDEX=$((INDEX + 1))
          done
          rm -rf "$CHUNK_DIR"

          RESPONSE="$(curl -sSf -X POST \
            "${{ inputs.server }}/api/v1/uploads/$UPLOAD_ID/complete?chunks=$INDEX" \
            -H "Authorization: Bearer $(fresh_token)")"
        fi

        echo "$RESPONSE" | jq .
        echo "build-id=$(echo "$RESPONSE" | jq -r '.build_id')" >> "$GITHUB_OUTPUT"

    - name: Attach symbols to the GitHub release
      id: attach
      if: >-
        inputs.publish == 'true' && inputs.attach-to-release == 'true' &&
        github.event_name == 'release' && steps.extract.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        SYMFILE="${{ steps.extract.outputs.symbol-file }}"
        # dSYM DWARF files carry no extension; name assets after the binary.
        ASSET="$(basename "${{ inputs.binary }}").symbols"
        case "$RUNNER_OS" in
          Linux) ASSET="$(basename "${{ inputs.binary }}").debug" ;;
          Windows) ASSET="$(basename "$SYMFILE")" ;;
        esac
        gh release upload "${{ github.event.release.tag_name }}" "$SYMFILE#$ASSET" --clobber

    - name: Report symbol publishing outcome
      if: always()
      shell: bash
      env:
        EXTRACT: ${{ steps.extract.outcome }}
        PUBLISH: ${{ steps.publish.outcome }}
        ATTACH: ${{ steps.attach.outcome }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -euo pipefail
        FAILED=""
        [ "$EXTRACT" = "failure" ] && FAILED="symbol extraction"
        [ "$PUBLISH" = "failure" ] && FAILED="${FAILED:+$FAILED, }symbol publishing"
        [ "$ATTACH" = "failure" ] && FAILED="${FAILED:+$FAILED, }release-asset upload"

        if [ -z "$FAILED" ]; then
          exit 0
        fi

        if [ "$FAIL_ON_ERROR" = "true" ]; then
          echo "::error::$FAILED failed - see the step logs above" >&2
          exit 1
        fi

        # Symbols are a debugging aid; losing one build's symbols is not
        # worth blocking its release. Surface the failure without failing.
        echo "::warning::$FAILED failed - this build's debug symbols were not published, but the release continues (set fail-on-error: true to fail instead)"
        if [ "$EXTRACT" = "failure" ]; then
          echo "::warning::because extraction failed, the binary was not stripped - release artifacts may be larger than usual"
        fi
