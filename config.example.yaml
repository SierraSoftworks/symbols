# Example configuration for the symbols server. In production this file is
# rendered by the Nomad pack's template (see SierraSoftworks/nomad-pack-registry,
# packs/symbols) with secrets injected from Nomad variables.
server:
  # Public plane: debuginfod reads of public projects and symbol uploads.
  public_addr: 0.0.0.0:8080
  # Internal plane: everything above plus unrestricted reads, the management
  # API, and the management UI. Only ever bind this to an address that is not
  # reachable from the public internet.
  internal_addr: 127.0.0.1:8081
  # The public plane's externally reachable base URL, used in the setup page's
  # snippets. Defaults to "https://{github.audience}".
  #public_url: https://symbols.sierrasoftworks.com

storage:
  endpoint: http://127.0.0.1:3900
  region: garage
  bucket: symbols
  access_key_id: EXAMPLE
  secret_access_key: EXAMPLE

github:
  # Repositories in these organizations may upload symbols; their projects
  # ("org/repo") are created automatically on first upload, seeded from the
  # repository's own visibility.
  trusted_orgs:
    - SierraSoftworks
  audience: symbols.sierrasoftworks.com
  # Only accept uploads from release tags.
  ref_prefixes:
    - refs/tags/

management:
  # OIDC issuer whose bearer tokens grant access to the management API, and
  # which users sign in against when `oidc` is configured below.
  issuer: https://idp.example.com
  audience: symbols.sierrasoftworks.com
  # Browser sign-in for the management UI (authorization code + PKCE,
  # exchanged server-side). Register the redirect URI
  # "{management UI base URL}/auth/callback" with the issuer. Omit this block
  # to run API-only (the UI then has no way to sign in).
  oidc:
    client_id: symbols-ui
    client_secret: EXAMPLE
    # scopes: [openid, profile, email]
  # Restrict the management plane to specific identities (`sub` or email).
  # Empty/omitted admits any authenticated user from the issuer — appropriate
  # when the issuer itself gates membership (e.g. tsidp only mints tokens for
  # tailnet members).
  #allowed_users:
  #  - benjamin@example.com
  # Signs browser session cookies; set it so sessions survive restarts
  # (randomised per boot when omitted).
  #session_secret: EXAMPLE
  # How long a browser session lasts before re-authentication.
  #session_duration: 8h

federation:
  # Unknown build IDs are looked up here (distro symbols: glibc, openssl, ...)
  # and cached in object storage. Set to null to disable.
  upstream: https://debuginfod.elfutils.org
  cache_limit_bytes: 268435456

retention:
  # Keep this many versions of each project's symbols (override per project
  # via the management API); prune the upstream cache after 90 days unused.
  default_keep_versions: 10
  sweep_interval: 24h
  upstream_cache_max_age: 2160h
