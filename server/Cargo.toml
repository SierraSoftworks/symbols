[package]
name = "symbols"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-hosted debug-symbol server speaking the debuginfod protocol, with OIDC-authenticated publishing from CI."

[dependencies]
actix-web = "4.13"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
hex = "0.4"
humantime-serde = "1.1"
# rust_crypto selects the process-level crypto provider; without exactly one
# provider feature, signing/validation panics at runtime.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
object = { version = "0.40", default-features = false, features = ["read"] }
object_store = { version = "0.11", features = ["aws"] }
pdb = "0.8"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
symbols-ui = { path = "../ui" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-batteries = { git = "https://github.com/sierrasoftworks/tracing-batteries-rs.git", features = [
  "opentelemetry",
] }
url = "2"
